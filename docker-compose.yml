services:
  # Dos réplicas del mismo motor
  paddleocr:
    build: .
    container_name: tpp_ocr_paddleocr
    ports:
      - "8007:8007"
    env_file:
      - .env
    environment:
      CPU_THREADS: ${PADDLE_CPU_THREADS:-5}
    networks:
      - tpp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/engine/livez"]
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 3

  paddleocr_2:
    build: .
    container_name: tpp_ocr_paddleocr_2
    ports:
      - "8017:8007"
    env_file:
      - .env
    environment:
      CPU_THREADS: ${PADDLE_CPU_THREADS:-5}
    networks:
      - tpp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/engine/livez"]
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tpp-net:
    external: true
    name: tpp-net
